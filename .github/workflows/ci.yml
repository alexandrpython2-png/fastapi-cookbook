name: CI

on:
  push:
    branches: ["**"]  # пуш в любую ветку
  pull_request:  # каждый pull request

# Новый пуш в ту же ветку отменяет ещё идущую проверку предыдущего
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        id: install
        run: pip install -r requirements-dev.txt
      # Каждый линтер запускается, даже если предыдущий нашёл ошибки: так видно сразу все проблемы
      - name: flake8
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: flake8 .
      - name: isort
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: isort --check-only --diff .
      - name: black
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: black --check --diff .
      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy .
      - name: bandit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bandit -r cookbook

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest --cov --cov-report=term-missing
